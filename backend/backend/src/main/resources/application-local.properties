app.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
app.cors.allow-localhost=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wobblevault_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Explicitly disable Flyway for local H2 environment
spring.flyway.enabled=false

# Allow the local profile to start even when the IDE does not pass env vars.
jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.auth.cookie.secure=false
server.port=${PORT:8081}

# Local H2 dev admin (seeded by DataSeeder; local profile only).
app.bootstrap-admin.email=admin@wobblevault.local
app.bootstrap-admin.password=Admin123!
